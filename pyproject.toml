[project]
name = "price-radar"
version = "0.1.0"
description = "Радар выгодных игровых предметов и скинов"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.14.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
